<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h2>Automation Dashboard</h2>

<a href="/">Back to Chatbot</a>

<div id="status"></div>

<script>

fetch("/engine_status")
.then(res => res.json())
.then(data => {

document.getElementById("status").innerHTML =
"Automation Health: " + data.health +
"<br>Mode: " + data.mode +
"<br>Signals: " + data.signals;

});

</script>

</body>
</html>
